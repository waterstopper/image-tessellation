<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta
      name="description"
      content="Tessellation turns a PNG or JPG into a mosaic of single-color tiles: squares, triangles, hexagons, Roman rhombille, tetrominoes, Penrose P3 and Voronoi cells, with tile-size and color-limit controls."
    />
    <title>Tessellation — image to mosaic</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0e'/%3E%3Cpath d='M32 8 54 20.5v23L32 56 10 43.5v-23Z' fill='none' stroke='%23d9ff63' stroke-width='3'/%3E%3Cpath d='M32 8v24m0 0 22-11.5M32 32 10 43.5' fill='none' stroke='%23d9ff63' stroke-width='3'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Tessellation — home">
          <span class="brand-mark" id="brand-mark"></span>
          <span class="brand-copy">
            <span class="brand-name">Tessellation</span>
            <span class="brand-sub">image → tessera</span>
          </span>
        </a>
        <div class="topbar-right">
          <span class="local-badge"><span class="local-dot"></span> local render</span>
          <button
            type="button"
            class="button ghost"
            id="compare-button"
            aria-pressed="false"
            disabled
            title="Show original"
          >
            <span class="button-icon" data-icon="compare"></span>
            <span class="button-label">Original</span>
          </button>
          <button type="button" class="button primary" id="download-button" disabled>
            <span class="button-icon" data-icon="download"></span>
            Download PNG
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <section class="panel-section">
            <div class="section-heading">
              <span class="eyebrow"><span class="eyebrow-num">01</span> Source</span>
            </div>
            <div class="source-card">
              <div class="source-thumb"><img id="source-thumb" alt="" /></div>
              <div class="source-info">
                <strong id="source-name">—</strong>
                <span id="source-dims">load an image</span>
              </div>
              <label class="mini-button" for="file-input">Upload</label>
              <input
                id="file-input"
                type="file"
                accept="image/png,image/jpeg,image/webp,image/avif,image/*"
                hidden
              />
            </div>
            <p class="hint">
              PNG, JPG, WebP · drop anywhere or paste with <kbd>⌘V</kbd> /
              <kbd>Ctrl+V</kbd>.
            </p>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <span class="eyebrow"><span class="eyebrow-num">02</span> Pattern</span>
            </div>
            <div
              id="tiling-grid"
              class="tiling-grid"
              role="group"
              aria-label="Tessellation type"
            ></div>
            <p class="hint" id="tiling-hint">A clean, predictable grid.</p>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <span class="eyebrow"><span class="eyebrow-num">03</span> Options</span>
              <button
                type="button"
                class="icon-button"
                id="shuffle-button"
                title="Shuffle layout"
                aria-label="Shuffle layout"
              >
                <span data-icon="shuffle"></span>
              </button>
            </div>

            <label class="control" for="tile-size">
              <span class="control-label">
                Tile size
                <output id="tile-size-value" for="tile-size">26 px</output>
              </span>
              <input id="tile-size" type="range" min="8" max="80" step="1" value="26" />
              <span class="range-legend"><span>small</span><span>large</span></span>
            </label>

            <label class="control" for="color-limit">
              <span class="control-label">
                Color limit
                <output id="color-limit-value" for="color-limit">12</output>
              </span>
              <input id="color-limit" type="range" min="1" max="40" step="1" value="12" />
              <span class="range-legend"><span>1 color</span><span>40 colors</span></span>
            </label>

            <label class="switch-row">
              <input id="unlimited-colors" type="checkbox" />
              <span class="switch" aria-hidden="true"></span>
              <span class="switch-label">
                Unlimited
                <small>each tile keeps its own average color</small>
              </span>
            </label>

            <label class="control" for="grout">
              <span class="control-label">
                Tile outlines
                <output id="grout-value" for="grout">0.8 px</output>
              </span>
              <input id="grout" type="range" min="0" max="2.4" step="0.1" value="0.8" />
              <span class="range-legend"><span>none</span><span>strong</span></span>
            </label>
          </section>
        </aside>

        <section class="stage-column">
          <div class="stage" id="stage">
            <div class="stage-checker" aria-hidden="true"></div>
            <canvas id="canvas" role="img" aria-label="Rendered mosaic"></canvas>
            <img id="original-image" alt="Original image" hidden />
            <div id="stage-empty" class="stage-empty" hidden>
              <span class="empty-mark" data-icon="upload"></span>
              <strong>Drop a PNG here</strong>
              <span>or choose a file in the sidebar</span>
            </div>
            <div id="drop-overlay" class="drop-overlay" hidden>
              <span class="empty-mark" data-icon="upload"></span>
              <strong>Drop to build the mosaic</strong>
            </div>
            <div id="busy-overlay" class="busy-overlay" role="status" aria-live="polite" hidden>
              <span class="spinner" aria-hidden="true"></span>
              <span id="busy-label">Building the mosaic…</span>
            </div>
          </div>

          <div
            class="palette-bar"
            id="palette-bar"
            title="The palette appears after an image is loaded"
          >
            <span class="palette-bar-label">
              Palette
              <span class="count-badge" id="palette-count">0</span>
            </span>
            <div id="palette" class="palette" aria-label="Used palette"></div>
          </div>

          <div class="stage-bar">
            <div class="stats" aria-live="polite">
              <span class="status-dot" id="status-dot"></span>
              <span id="stats">Loading demo…</span>
            </div>
            <div class="stage-actions">
              <button type="button" class="button ghost small" id="sample-button">Demo</button>
              <button type="button" class="button quiet small" id="open-file-button">
                <span class="button-icon" data-icon="upload"></span>
                Upload
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <noscript>This app requires JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
